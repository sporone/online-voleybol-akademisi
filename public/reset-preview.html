<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ön izleme yenileniyor</title></head>
<body style="font-family:Arial,sans-serif;padding:32px;color:#17384f"><b>Ön izleme yenileniyor…</b>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(item=>item.unregister()))}
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)))}
  }finally{
    location.replace('/giris/?clean='+Date.now());
  }
})();
</script></body>
</html>
